[project]
name = "fl-api"
version = "0.1.0"
description = "Google Flow (Veo) generation core: Dolphin Anty accounts, reCAPTCHA sessions, batch modes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2,socks]>=0.28.1",
    "playwright>=1.49.0",
    "loguru>=0.7.3",
    "pydantic-settings>=2.7.0",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
