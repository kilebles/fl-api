[project]
name = "fl-api"
version = "0.1.0"
description = "Google Flow (Veo) generation core: Dolphin Anty accounts, reCAPTCHA sessions, batch modes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2,socks]>=0.28.1",
    "playwright>=1.49.0",
    "loguru>=0.7.3",
    "pydantic-settings>=2.7.0",
    "openpyxl>=3.1.5",
    "fastapi>=0.142.4",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "aiosqlite>=0.22.1",
    "boto3>=1.43.109",
    "python-multipart>=0.0.32",
    "google-genai>=2.17",
    "openai>=3.31.0",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
timeout = 60
