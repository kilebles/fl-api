    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (typeof n === 'string') {
        var s = interp(n, scopes);
        if (s !== '') out.push({ text: s });
        continue;
      }
      var tag = n.t;
      if (tag === 'helmet') continue;
      if (tag === 'sc-if') {
        if (evalAttr(attrOf(n, 'value'), scopes)) out.push.apply(out, build(n.c, scopes, svg));
        continue;
      }
      if (tag === 'sc-for') {
        var list = evalAttr(attrOf(n, 'list'), scopes) || [];

          sc[as] = list[li];
          out.push.apply(out, build(n.c, [sc].concat(scopes), svg));
        }
        continue;
      }
      if (tag === 'dc-import') {
        var cname = attrOf(n, 'name');
        var props = {};
        n.a.forEach(function (kv) {
          if (kv[0] === 'name' || kv[0].indexOf('hint-') === 0) return;
          props[camel(kv[0])] = evalAttr(kv[1], scopes);
        });
        occ[cname] = (occ[cname] || 0) + 1;
        out.push.apply(out, renderComp('child:' + cname + '#' + occ[cname], cname, props));
        continue;

      var vn = { tag: tag, svg: isSvg, attrs: {}, props: {}, events: {}, init: null, ch: [] };
      for (var ai = 0; ai < n.a.length; ai++) {
        var k = n.a[ai][0], v = n.a[ai][1];
        if (v == null) v = '';
        var hole = WHOLE.exec(v);
        if (/^on[a-z]+$/.test(k)) {
          if (hole) {
            var fn = lookup(hole[1], scopes);
            if (typeof fn === 'function') vn.events[eventName(k, n)] = fn;
          }
          continue;
        }
        if (k === 'value' || k === 'checked' || k === 'selected') {
          if (hole) vn.props[k] = lookup(hole[1], scopes);
          else { vn.init = vn.init || {}; vn.init[k] = k === 'value' ? v : true; }
          continue;
        }
        if (k === 'disabled') {
          if (hole ? lookup(hole[1], scopes) : true) vn.attrs.disabled = '';
          continue;
        }
        var val = hole ? lookup(hole[1], scopes) : interp(v, scopes);
        if (val === false || val == null) {
          if (val === false && k.indexOf('aria-') === 0) vn.attrs[k] = 'false';
          continue;
        }

          vn.init = vn.init || {};
          vn.init.value = interp(txt.replace(/^\n/, ''), scopes);

  function onEvent(e) {

  function create(v) {

  function update(el, v, isNew) {
    var old = el.__a || {};

    for (k in v.attrs) if (old[k] !== v.attrs[k]) el.setAttribute(k, v.attrs[k]);
    el.__a = v.attrs;
    el.__h = v.events;
    el.__l = el.__l || {};

  function patchChildren(p, vch) {

  function render() {
    pending = false;
    if (!current) return;
    created = [];
    occ = {};
    var vnodes = renderComp('screen:' + current, current, {});
    patchChildren(app, vnodes);
    var fresh = created;
    created = [];
    fresh.forEach(function (inst) { if (inst.componentDidMount) inst.componentDidMount(); });

  var toggle = document.createElement('div');
  toggle.id = 'theme-toggle';
  toggle.setAttribute('role', 'group');
  toggle.setAttribute('aria-label', 'Цветовая тема');
  document.body.appendChild(toggle);
  function paintToggle() {
    var claude = /^Claude_/.test(current);
    var base = current.replace(/^Claude_/, '');
    toggle.style.background = claude ? '#FFFFFF' : '#16181D';
    toggle.style.border = '1px solid ' + (claude ? '#E8E6DC' : '#2A2E37');
    toggle.innerHTML = '';
    [['Тёмная', base, !claude], ['Claude', 'Claude_' + base, claude]].forEach(function (o) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = o[0];

      b.onclick = function () { location.hash = o[1]; };

  function go(name) {
    if (!T[name] || /Nav$/.test(name)) name = /^Claude_/.test(name) ? 'Claude_Main' : 'Main';
    if (current === name) return;
    current = name;
    document.documentElement.style.colorScheme = T[name].scheme;
    paintToggle();
    screenStyle.textContent = T[name].css;
    document.title = T[name].title + ' · Motion Pr';
    app.textContent = '';
    render();
    window.scrollTo(0, 0);
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    var href = a.getAttribute('href');
    if (href === '#') { e.preventDefault(); return; }
    var m = /^\/?([\w-]+)\.dc\.html$/.exec(href);
    if (m) { e.preventDefault(); location.hash = m[1]; }
  });

  function fromHash() { go(decodeURIComponent(location.hash.replace(/^#/, '')) || 'Main'); }
  window.addEventListener('hashchange', fromHash);
  fromHash();
})();
